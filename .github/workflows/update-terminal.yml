name: Refresh profile terminal

on:
  workflow_dispatch:
  schedule:
    # Monday at 08:00 Asia/Jakarta (01:00 UTC).
    - cron: "0 1 * * 1"

permissions:
  contents: write

jobs:
  generate-terminal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install generator
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt

      - name: Generate terminal GIF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile_terminal.py

      - name: Commit refreshed GIF
        run: |
          if git diff --quiet -- assets/terminal.gif; then
            echo "Terminal GIF is already current."
            exit 0
          fi
          git config user.name "r4m profile bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/terminal.gif
          git commit -m "chore: refresh profile terminal"
          git push
